ARC-CMP-004:
  # Elevated route/DNS verification is host-local and deterministic; packet
  # carriage remains a separate integration responsibility.
  # Process orchestration coverage includes bounded reconnect waits across
  # expected self-restart relaunches in the integration harness.
  # Hosted macOS elevated gates keep Admin/helper state assertions even when
  # the runner refuses route, ping, SMAppService approval, packaged-XPC enable,
  # packaged-XPC Admin status polling, or inline TUN-row publication side effects.
  # The macOS elevated scripts preserve CI identity through sudo so those
  # hosted-runner branches remain active after privilege escalation.
  # Synology wrapper coverage also pins the declared python314 package
  # dependency, beta-package metadata, DSM-acceptable outer archive shape,
  # restart-exit-code handling, package-managed dependency-bootstrap
  # metadata, package-user helper-handoff wiring, and the wrapper-side
  # errexit relaxation needed to translate rc=75/77 into DSM-managed relaunch
  # instead of a final service stop.
