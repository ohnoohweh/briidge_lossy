# This manifest links stable architecture component IDs to defending tests.
# It is intentionally narrower than the product-requirement traceability file:
# it captures component-level evidence where the architecture decomposition
# itself matters, especially for joint-function responsibilities.
#
# Keep this file state-based:
# - list only active component-to-test mappings
# - do not record rollout chronology or PR notes here
# - keep architectural rationale in docs/ARCHITECTURE.md
# Public documentation and test fixtures use IANA-reserved documentation
# address ranges rather than live deployment endpoints.

