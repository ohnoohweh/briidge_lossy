name: Swift Concurrency Guard
on: [push, pull_request]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - run: python scripts/check_swift_concurrency_guard.py --base-ref "${{ github.event.pull_request.base.sha || github.event.before }}"
