name: bridge.py Integration Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A branch with an open PR receives both push and pull_request events.  Keep
# the PR event as its single validation run, and abandon an older matrix as
# soon as the PR receives a newer commit.
concurrency:
  group: bridge-integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-bridge-change:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
      swift_changed: ${{ steps.changed.outputs.swift_changed }}
      macos_tun_changed: ${{ steps.changed.outputs.macos_tun_changed }}
      macos_host_runner_changed: ${{ steps.changed.outputs.macos_host_runner_changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect bridge changes
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event_name }}" == "push" ]]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-parse "${head}^" 2>/dev/null || true)"
            elif ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
              git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
              base="$(git merge-base "$head" "origin/${{ github.event.repository.default_branch }}")"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "swift_changed=true" >> "$GITHUB_OUTPUT"
            echo "macos_tun_changed=true" >> "$GITHUB_OUTPUT"
            echo "macos_host_runner_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "${base:-}" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "swift_changed=true" >> "$GITHUB_OUTPUT"
            echo "macos_tun_changed=true" >> "$GITHUB_OUTPUT"
            echo "macos_host_runner_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base" "$head")"

          if printf '%s\n' "$changed_files" | grep -Eq '(^src/|^tests/|^scripts/|^ObstacleBridge\.py$|^pyproject\.toml$|\.py$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^ios/|^src/|^tests/|^scripts/.*tun-hook.*|^ObstacleBridge\.py$|^pyproject\.toml$|\.(py|swift)$)'; then
            echo "swift_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^tests/integration/test_macos(_swift)?_elevated\.py$|^ios/tests/test_macos_swift_host_runner\.py$|^ios/native/ObstacleBridge(App|PrivilegedHelper|Shared)/(ObstacleBridge(HostRunner|TunnelControl|MacOSTun|TunHelper|ChannelMuxTun|PacketTunnelConfiguration|TunProbe|TunPing)).*\.swift$|^ios/scripts/build_macos_app\.sh$|^scripts/(run_macos(_swift)?_elevated_tests\.sh|(client|server)-tun-hook-macos\.sh)$|^src/obstacle_bridge/bridge_(tun|channelmux_shared_tun).*\.py$)'; then
            echo "macos_tun_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_tun_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed_files" | grep -Eq '(^ios/tests/test_macos_swift_host_runner\.py$|^ios/tests/swift_test_support\.py$|^ios/native/ObstacleBridge(App|PrivilegedHelper)/(ObstacleBridgeHostRunner|ObstacleBridgeTunPrivilegedHelperMain).*\.swift$|^ios/native/ObstacleBridgeShared/ObstacleBridge(TunHelper|TunHelperXPCTransport|MacOSTun|ChannelMuxTun|PacketTunnelConfiguration).*\.swift$|^ios/scripts/build_macos_app\.sh$)'; then
            echo "macos_host_runner_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos_host_runner_changed=false" >> "$GITHUB_OUTPUT"
          fi

  bridge-py-integration-linux:
    name: Integration Gate (Linux shared)
    timeout-minutes: 15
    needs: detect-bridge-change
    if: needs.detect-bridge-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      # The Linux/Swift scenarios share one runner binary. Build it before
      # xdist starts so workers never wait on the test helper's global lock.
      - name: Build Linux Swift runner once
        run: ./scripts/build_linux_app.sh

      - name: Run Linux Swift live-runtime closure tests
        run: swift test --filter ObstacleBridgeLinuxLiveRuntimeTests

      - name: Run Linux Swift integration subset
        # These tests own multiple peers and network processes. Four workers
        # keep their lifecycle deadlines reliable on hosted Linux runners.
        # The full Python-overlay lifecycle matrix is manual qualification;
        # routine PR validation covers the Linux Swift product boundary.
        run: pytest -vv --timeout=90 -n 4 tests/integration/test_overlay_e2e.py -m "not windows_only" -k "linux_swift"

  bridge-py-integration-linux-full:
    name: Integration Gate (Linux full overlay qualification)
    timeout-minutes: 30
    needs: detect-bridge-change
    if: github.event_name == 'workflow_dispatch' && needs.detect-bridge-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Build Linux Swift runner once
        run: ./scripts/build_linux_app.sh

      - name: Run full Linux overlay qualification suite
        run: pytest -vv --timeout=90 -n 4 tests/integration/test_overlay_e2e.py -m "not windows_only"

  bridge-py-integration-windows:
    name: Integration Gate (Windows-specific)
    needs: detect-bridge-change
    if: needs.detect-bridge-change.outputs.changed == 'true'
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Windows-specific integration suite
        shell: bash
        run: pytest -q -n 4 tests/integration/test_overlay_e2e.py -m "windows_only"

  bridge-py-integration-macos-elevated:
    name: "Integration Gate (macOS elevated TUN: ${{ matrix.case }})"
    needs: detect-bridge-change
    if: needs.detect-bridge-change.outputs.macos_tun_changed == 'true'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: inline-route-dns
            target: tests/integration/test_macos_elevated.py::test_macos_elevated_inline_tun_applies_routes_dns_and_reports_verification
          - case: helper-packet-carry
            target: tests/integration/test_macos_elevated.py::test_overlay_e2e_macos_elevated_tun_helper_native_creates_utun_and_applies_hooks
          - case: helper-route-dns
            target: tests/integration/test_macos_elevated.py::test_macos_elevated_darwin_native_helper_applies_routes_and_dns_live
          - case: helper-death-cleanup
            target: tests/integration/test_macos_elevated.py::test_overlay_e2e_macos_elevated_tun_helper_native_reports_helper_death_cleanup
          - case: helper-death-route-dns-warning
            target: tests/integration/test_macos_elevated.py::test_overlay_e2e_macos_elevated_tun_helper_native_reports_helper_death_with_route_dns_warning
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Verify passwordless sudo
        run: sudo -n true

      - name: Run macOS elevated TUN subset
        env:
          OBSTACLEBRIDGE_MACOS_ELEVATED_TEST_TARGET: ${{ matrix.target }}
        run: ./scripts/run_macos_elevated_tests.sh

  bridge-py-integration-macos-swift-probe:
    name: Integration Gate (macOS Swift probe)
    needs: detect-bridge-change
    if: needs.detect-bridge-change.outputs.swift_changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Swift toolchain
        run: |
          swift --version
          swiftc --version
          swift build --target ObstacleBridgeCore
          swift build --target ObstacleBridgeApplePackageProbe
          swift test --filter ObstacleBridgeCryptoTests
          swift test --filter ObstacleBridgeApplePackageProbeTests

      - name: Probe required Swift modules
        shell: bash
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          cat > "$tmp_dir/CryptoKitProbe.swift" <<'EOF'
          import Foundation
          import CryptoKit
          let digest = SHA256.hash(data: Data("probe".utf8))
          _ = digest
          EOF

          cat > "$tmp_dir/ZlibProbe.swift" <<'EOF'
          import zlib
          _ = Z_NO_FLUSH
          EOF

          swiftc -typecheck "$tmp_dir/CryptoKitProbe.swift"
          swiftc -typecheck "$tmp_dir/ZlibProbe.swift"

  bridge-py-integration-macos-swift:
    name: Integration Gate (macOS Swift-backed)
    timeout-minutes: 15
    needs:
      - detect-bridge-change
      - bridge-py-integration-macos-swift-probe
    if: needs.detect-bridge-change.outputs.swift_changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Swift toolchain
        run: |
          swift --version
          swiftc --version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run Swift-backed host-side suites
        env:
          PYTHONPATH: src:ios/src
        # Host-runner product E2E tests start complete app processes and wait on
        # network lifecycle deadlines.  They are qualification tests, not a
        # useful per-change signal for Core/adapter work, and run in their own
        # targeted lane when their product surface changes.
        # The remaining probes each invoke swiftc.  Three workers use the
        # macOS runner's CPUs without allowing an unbounded compiler fan-out.
        run: pytest -vv --timeout=120 -n 3 -m "not slow" tests/unit/test_channel_mux_swift_parity.py ios/tests --ignore=ios/tests/test_macos_swift_host_runner.py

  bridge-py-integration-macos-host-runner:
    name: Integration Gate (macOS host-runner qualification)
    timeout-minutes: 15
    needs:
      - detect-bridge-change
      - bridge-py-integration-macos-swift-probe
    # This full app-process and network-lifecycle suite is deliberate product
    # qualification, not a useful per-push Core signal.
    if: github.event_name == 'workflow_dispatch' && needs.detect-bridge-change.outputs.macos_host_runner_changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Swift toolchain
        run: |
          swift --version
          swiftc --version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Run macOS host-runner qualification suite
        env:
          PYTHONPATH: src:ios/src
        run: pytest -vv --timeout=120 -m "not slow" ios/tests/test_macos_swift_host_runner.py

  bridge-py-integration-macos-swift-elevated:
    name: Integration Gate (macOS Swift elevated TUN)
    timeout-minutes: 15
    needs:
      - detect-bridge-change
      - bridge-py-integration-macos-swift-probe
    # The independently scheduled elevated matrix supplies routine coverage.
    # This app-process/XPC suite waits on approval and shutdown boundaries, so
    # it is explicit qualification rather than a redundant PR timeout source.
    if: github.event_name == 'workflow_dispatch' && needs.detect-bridge-change.outputs.swift_changed == 'true' && needs.detect-bridge-change.outputs.macos_tun_changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Swift toolchain
        run: |
          swift --version
          swiftc --version

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Verify passwordless sudo
        run: sudo -n true

      - name: Run macOS Swift elevated TUN subset
        run: ./scripts/run_macos_swift_elevated_tests.sh

  bridge-py-integration-not-required:
    name: Integration Gate (No Python changes)
    needs: detect-bridge-change
    if: needs.detect-bridge-change.outputs.changed != 'true' && needs.detect-bridge-change.outputs.swift_changed != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: No Python changes
        run: echo "No Python changes; integration gate not required."
