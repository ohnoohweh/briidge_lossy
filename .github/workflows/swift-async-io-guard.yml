name: Swift Async I/O Guard

on:
  pull_request:
  push:
    branches: [main]

jobs:
  swift-async-io-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - if: github.event_name == 'pull_request'
        run: python scripts/check_swift_async_io_guard.py --base-ref "${{ github.event.pull_request.base.sha }}"
      - if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python scripts/check_swift_async_io_guard.py --base-ref "${{ github.event.before }}"
