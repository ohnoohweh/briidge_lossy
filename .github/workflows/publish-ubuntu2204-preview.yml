name: Publish Ubuntu 22.04 native preview

on:
  push:
    branches: [main, codex/release-assets-execution-smoke]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name == 'main' && 'macos-preview' || 'release-assets-smoke' }}

concurrency:
  group: publish-ubuntu2204-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Ubuntu 22.04 native archive
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Swift toolchain
        run: swift --version

      - name: Build the native Linux product
        run: |
          set -euo pipefail
          scripts/build_linux_app.sh --output-dir build/ubuntu2204
          tar -C build/ubuntu2204 -czf ObstacleBridge-linux-ubuntu-22.04.5-lts.tar.gz ObstacleBridgeLinux ObstacleBridgeProxyWorker ObstacleBridgeLogCollector ObstacleBridgeLinux.build-info.json admin_web
          sha256sum ObstacleBridge-linux-ubuntu-22.04.5-lts.tar.gz > ObstacleBridge-linux-ubuntu-22.04.5-lts.tar.gz.sha256

      - name: Publish the Ubuntu archive
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$TARGET" --title 'Release-assets smoke test' --prerelease --notes 'Temporary release-workflow smoke-test artifacts.' || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release edit "$RELEASE_TAG" --target "$TARGET"
          gh release upload "$RELEASE_TAG" ObstacleBridge-linux-ubuntu-22.04.5-lts.tar.gz ObstacleBridge-linux-ubuntu-22.04.5-lts.tar.gz.sha256 --clobber
