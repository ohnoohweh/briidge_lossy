name: Publish Python source preview

on:
  push:
    branches: [main, codex/release-assets-execution-smoke]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name == 'main' && 'macos-preview' || 'release-assets-smoke' }}

concurrency:
  group: publish-python-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Package and publish Python source ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create installable source ZIP
        run: |
          set -euo pipefail
          artifact_root="dist/python/staging/ObstacleBridge-python-preview"
          rm -rf "${artifact_root}"
          mkdir -p "${artifact_root}"
          git archive HEAD | tar -x -C "${artifact_root}"
          python scripts/write_build_info.py --python-target "${artifact_root}/src/obstacle_bridge/_generated/build_info_generated.py"
          expected_commit="$(git rev-parse --short=8 HEAD)"
          (cd "${artifact_root}" && PYTHONPATH="${artifact_root}" python - <<PY
          from obstacle_bridge.bridge import _detect_build_info

          info = _detect_build_info()
          assert info["commit"] == "${expected_commit}", info
          assert info["source"] == "embedded-build-info", info
          assert info["available"] is True, info
          PY
          )
          mkdir -p dist/python
          (cd dist/python/staging && zip -qr ../ObstacleBridge-python-preview.zip ObstacleBridge-python-preview)
          unzip -t dist/python/ObstacleBridge-python-preview.zip
          sha256sum dist/python/ObstacleBridge-python-preview.zip > dist/python/ObstacleBridge-python-preview.zip.sha256

      - name: Publish the Python source ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$TARGET" --title 'Release-assets smoke test' --prerelease --notes 'Temporary release-workflow smoke-test artifacts.' || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release edit "$RELEASE_TAG" --target "$TARGET"
          gh release upload "$RELEASE_TAG" dist/python/ObstacleBridge-python-preview.zip dist/python/ObstacleBridge-python-preview.zip.sha256 --clobber
