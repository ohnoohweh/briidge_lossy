name: Publish Synology preview

on:
  push:
    branches: [main, codex/release-assets-execution-smoke]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name == 'main' && 'macos-preview' || 'release-assets-smoke' }}

concurrency:
  group: publish-synology-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Synology DSM SPK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install package probe dependency
        run: python -m pip install --disable-pip-version-check cryptography

      - name: Build and verify the DSM package
        run: |
          set -euo pipefail
          python scripts/build_synology_spk.py --build-number "${{ github.run_number }}"
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          import tempfile

          package = next(pathlib.Path('dist/synology').glob('*.spk'))
          with tempfile.TemporaryDirectory(prefix='obstaclebridge-spk-probe-') as probe_root:
              with tarfile.open(package) as archive:
                  assert 'INFO' in archive.getnames()
                  assert 'package.tgz' in archive.getnames()
                  payload = archive.extractfile('package.tgz')
                  assert payload is not None
                  with tarfile.open(fileobj=payload, mode='r:gz') as nested:
                      nested.extractall(probe_root)
              import sys
              sys.path.insert(0, str(pathlib.Path(probe_root) / 'src'))
              from obstacle_bridge.bridge import _detect_build_info
              info = _detect_build_info()
              assert info['commit'] == os.environ['GITHUB_SHA'][:8], info
              assert info['source'] == 'embedded-build-info', info
              assert info['available'] is True, info
          print(package)
          PY
          sha256sum dist/synology/*.spk > dist/synology/ObstacleBridge-synology-preview.spk.sha256

      - name: Publish the SPK
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$TARGET" --title 'Release-assets smoke test' --prerelease --notes 'Temporary release-workflow smoke-test artifacts.' || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release edit "$RELEASE_TAG" --target "$TARGET"
          # SPK filenames contain the DSM build number, so --clobber alone
          # cannot replace an earlier preview package with a different name.
          # Keep the prerelease to one installable, current DSM package.
          while IFS= read -r previous_spk; do
            [ -z "$previous_spk" ] || gh release delete-asset "$RELEASE_TAG" "$previous_spk" --yes
          done < <(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name | select(test("^obstaclebridge-.+-noarch\\.spk$"))')
          gh release upload "$RELEASE_TAG" dist/synology/*.spk dist/synology/ObstacleBridge-synology-preview.spk.sha256 --clobber
