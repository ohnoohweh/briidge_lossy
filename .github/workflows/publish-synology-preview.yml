name: Publish Synology preview

on:
  push:
    branches: [main, codex/release-assets-execution-smoke]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name == 'main' && 'macos-preview' || 'release-assets-smoke' }}

concurrency:
  group: publish-synology-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Synology DSM SPK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build and verify the DSM package
        run: |
          set -euo pipefail
          python scripts/build_synology_spk.py --build-number "${{ github.run_number }}"
          python - <<'PY'
          import pathlib
          import tarfile

          package = next(pathlib.Path('dist/synology').glob('*.spk'))
          with tarfile.open(package) as archive:
              assert 'INFO' in archive.getnames()
              assert 'package.tgz' in archive.getnames()
          print(package)
          PY
          sha256sum dist/synology/*.spk > dist/synology/ObstacleBridge-synology-preview.spk.sha256

      - name: Publish the SPK
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$TARGET" --title 'Release-assets smoke test' --prerelease --notes 'Temporary release-workflow smoke-test artifacts.' || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release edit "$RELEASE_TAG" --target "$TARGET"
          gh release upload "$RELEASE_TAG" dist/synology/*.spk dist/synology/ObstacleBridge-synology-preview.spk.sha256 --clobber
