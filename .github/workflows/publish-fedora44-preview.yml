name: Publish Fedora 44 native preview

on:
  push:
    branches: [main, codex/release-assets-execution-smoke]
  workflow_dispatch:

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.ref_name == 'main' && 'macos-preview' || 'release-assets-smoke' }}

concurrency:
  group: publish-fedora44-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Fedora 44 native archive
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: dnf --assumeyes install git gh tar gzip findutils swift-lang

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build the native Linux product
        run: |
          set -euo pipefail
          scripts/build_linux_app.sh --output-dir build/fedora44
          tar -C build/fedora44 -czf ObstacleBridge-linux-fedora-44.tar.gz ObstacleBridgeLinux ObstacleBridgeProxyWorker ObstacleBridgeLogCollector ObstacleBridgeLinux.build-info.json admin_web
          sha256sum ObstacleBridge-linux-fedora-44.tar.gz > ObstacleBridge-linux-fedora-44.tar.gz.sha256

      - name: Publish the Fedora archive
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$TARGET" --title 'Release-assets smoke test' --prerelease --notes 'Temporary release-workflow smoke-test artifacts.' || true
          fi
          gh release view "$RELEASE_TAG" >/dev/null
          gh release edit "$RELEASE_TAG" --target "$TARGET"
          gh release upload "$RELEASE_TAG" ObstacleBridge-linux-fedora-44.tar.gz ObstacleBridge-linux-fedora-44.tar.gz.sha256 --clobber
