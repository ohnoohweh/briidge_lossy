name: Publish Fedora 44 native preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-fedora44-preview
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish Fedora 44 native archive
    runs-on: ubuntu-latest
    container: fedora:44
    timeout-minutes: 30
    steps:
      - name: Install build tools
        run: dnf --assumeyes install git gh tar gzip findutils swift-lang zlib-devel

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Trust the container-mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the native Linux product
        shell: bash
        run: |
          set -euo pipefail
          scripts/build_linux_app.sh --output-dir build/fedora44
          tar -C build/fedora44 -czf ObstacleBridge-linux-fedora-44.tar.gz ObstacleBridgeLinux ObstacleBridgeProxyWorker ObstacleBridgeLogCollector ObstacleBridgeLinux.build-info.json admin_web
          sha256sum ObstacleBridge-linux-fedora-44.tar.gz > ObstacleBridge-linux-fedora-44.tar.gz.sha256

      - name: Publish the Fedora archive
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! gh release view macos-preview >/dev/null 2>&1; then
            gh release create macos-preview --target "$TARGET" --title 'Latest main preview (all platforms)' --prerelease --notes 'Latest main preview artifacts. Verify each attached SHA-256 before use.' || true
          fi
          gh release view macos-preview >/dev/null
          gh release edit macos-preview --target "$TARGET"
          gh release upload macos-preview ObstacleBridge-linux-fedora-44.tar.gz ObstacleBridge-linux-fedora-44.tar.gz.sha256 --clobber
